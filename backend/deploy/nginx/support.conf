# Dedicated support host. Certbot adds HTTPS before activation.
server {
    listen 80;
    listen [::]:80;
    server_name supp.khaanehyar.ir;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/khaneyar;
        try_files $uri =404;
    }
    location / { return 301 https://supp.khaanehyar.ir$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name supp.khaanehyar.ir;
    ssl_certificate /etc/letsencrypt/live/supp.khaanehyar.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/supp.khaanehyar.ir/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /var/www/khaneyar;
    index support.html;
    client_max_body_size 8k;

    location ^~ /api/v1/support/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
    location /api/ { return 404; }
    # This support site does not install the household background worker.
    location = /registerSW.js { default_type application/javascript; return 200 ''; }
    location = /sw.js { return 404; }
    location = /support { return 308 https://supp.khaanehyar.ir/; }
    location = /support/ { return 308 https://supp.khaanehyar.ir/; }
    location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; }
    location / { add_header Cache-Control "no-store" always; try_files $uri $uri/ /support.html; }
}
