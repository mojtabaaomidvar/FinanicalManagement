# خانه‌یار — کانفیگِ nginxِ هاست (reverse proxy برای API + SSL)
#
# نصب روی سرور:
#   sudo cp khaneyar.conf /etc/nginx/sites-available/khaneyar.conf
#   sudo ln -s /etc/nginx/sites-available/khaneyar.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# سپس SSL:
#   sudo certbot --nginx -d api.khaanehyar.ir
# (certbot خودش بلاکِ 443 و ریدایرکتِ 80→443 و تمدیدِ خودکار را اضافه می‌کند.)

# ── API: api.khaanehyar.ir → کانتینرِ اپ روی 127.0.0.1:8000 ──
server {
    listen 80;
    listen [::]:80;
    server_name api.khaanehyar.ir;

    # آپلودِ عکس: سقفِ اپ ~۱MB پس از دیکود، بدنهٔ base64 ~۱٫۴MB؛ ۵ مگ حاشیهٔ امن است.
    client_max_body_size 5m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

