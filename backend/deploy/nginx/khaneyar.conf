# خانه‌یار — کانفیگ nginx هاست
#
# سه میزبان روی یک سرور:
#   api.khaanehyar.ir  → reverse proxy به کانتینر اپ (127.0.0.1:8000)
#   khaanehyar.ir      → سایت معرفی (استاتیک، پوشهٔ site/) + فایل نصب APK
#   pwa.khaanehyar.ir  → خودِ برنامه (PWA، خروجی build/dist) با SPA fallback
#
# نصب روی سرور:
#   sudo cp khaneyar.conf /etc/nginx/sites-available/khaneyar.conf
#   sudo ln -s /etc/nginx/sites-available/khaneyar.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# سپس SSL برای هر سه دامنه با یک دستور:
#   sudo certbot --nginx -d api.khaanehyar.ir -d khaanehyar.ir -d www.khaanehyar.ir -d pwa.khaanehyar.ir
# (certbot خودش بلاک 443 و ریدایرکت 80→443 و تمدید خودکار را اضافه می‌کند.)

# ── API: api.khaanehyar.ir → کانتینر اپ روی 127.0.0.1:8000 ──
server {
    listen 80;
    listen [::]:80;
    server_name api.khaanehyar.ir;

    # آپلود عکس: سقف اپ ~۱MB پس از دیکود، بدنهٔ base64 ~۱٫۴MB؛ ۵ مگ حاشیهٔ امن است.
    client_max_body_size 5m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

# ── سایت معرفی: khaanehyar.ir (+www) → استاتیک از /var/www/khaneyar-site ──
# محتوای پوشهٔ site/ توسط deploy.bat اینجا آپلود می‌شود: صفحهٔ اصلی + /download/
# + فایل نصب /khanehyar.apk. اینجا SPA fallback نداریم؛ سایت صفحه‌های
# واقعی روی دیسک دارد، پس مسیر ناموجود باید ۴۰۴ بدهد نه اینکه صفحهٔ اصلی را برگرداند.
server {
    listen 80;
    listen [::]:80;
    server_name khaanehyar.ir www.khaanehyar.ir;

    root /var/www/khaneyar-site;
    index index.html;

    # URLهای پوشه‌ای: /download/ خودش index.html دارد.
    location / {
        try_files $uri $uri/ =404;
    }

    # مسیر بازنشستهٔ /web/ — تا ۱۴۰۵/۰۶/۲۴ صفحهٔ «نسخهٔ وب» اینجا بود و حالا
    # محتوایش داخل /download/ (دستهٔ آیفون) رفته است. لینک‌های قدیمیِ بیرونی
    # نباید ۴۰۴ بگیرند، پس دائمی به همان‌جا می‌روند.
    location = /web/ { return 301 /download/#ios; }
    location = /web  { return 301 /download/#ios; }

    # سرویس‌ورکرِ «خودکش» روی ریشه — فقط برای پاک‌کردن رجیستریشن قدیمی اپ.
    # مرورگر برای بررسی به‌روزرسانی این آدرس را می‌گیرد؛ این نسخه خودش را
    # unregister می‌کند و کش‌ها را پاک می‌کند. هرگز نباید کش شود، وگرنه
    # مرورگر همان نسخهٔ قدیمی را نگه می‌دارد و مشکل رفع نمی‌شود.
    location = /sw.js {
        default_type application/javascript;
        add_header Cache-Control "no-store, must-revalidate";
        add_header Service-Worker-Allowed "/";
    }

    # فایل نصب اندروید: با نام درست دانلود شود و کش نشود (هر انتشار جایگزینش می‌کند).
    location = /khanehyar.apk {
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition 'attachment; filename="khanehyar.apk"';
        add_header Cache-Control "no-store";
    }

    # دارایی‌های نسخه‌دارِ سایت (فونت/CSS) — کش بلندمدت.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public";
    }
}

# ── خودِ برنامه: pwa.khaanehyar.ir → PWA از /var/www/khaneyar با SPA fallback ──
# اپِ نصب‌شدهٔ اندروید هم همین آدرس را در WebView لود می‌کند (capacitor server.url).
# اینجا برخلافِ سایت، SPA fallback لازم است چون مسیریابی داخلِ خود اپ (JS) است و
# فایلی روی دیسک برای /home یا /settings وجود ندارد.
server {
    listen 80;
    listen [::]:80;
    server_name pwa.khaanehyar.ir;

    root /var/www/khaneyar;
    index index.html;

    # فایل‌های استاتیک نسخه‌دارِ Vite — کش یک‌ساله و immutable.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback — همهٔ مسیرها به index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
