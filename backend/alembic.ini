# پیکربندی Alembic — «خانه‌یار» بک‌اند
# نشانی دیتابیس اینجا هاردکد نمی‌شود؛ در alembic/env.py از settings.database_url خوانده می‌شود.

[alembic]
script_location = alembic
prepend_sys_path = .
# قالب نام فایل نسخه‌ها: 0001_slug.py
file_template = %%(rev)s_%%(slug)s
# منطقهٔ زمانی برچسب‌های تولیدشده
timezone = UTC
# sqlalchemy.url عمداً خالی است — env.py آن را از تنظیمات تزریق می‌کند.
sqlalchemy.url =

[post_write_hooks]
# قالب‌بندی خودکار فایل مهاجرت پس از autogenerate (اختیاری؛ نیازمند نصب ruff)
hooks = ruff
ruff.type = console_scripts
ruff.entrypoint = ruff
ruff.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
