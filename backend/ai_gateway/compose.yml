name: khaneyar-ai-gateway
services:
  gateway:
    image: ${AI_GATEWAY_IMAGE:-khaneyar-ai-gateway-gateway}
    build:
      context: ..
      dockerfile: ai_gateway/Dockerfile
    env_file: .env
    ports:
      - "127.0.0.1:5810:8000"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: 1
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"
