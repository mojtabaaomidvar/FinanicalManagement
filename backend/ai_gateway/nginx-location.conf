# Add inside an existing HTTPS server block owned by this project.
# Client base URL: https://YOUR_HOST/ai-gateway
location = /ai-gateway/v1/sms/analyze {
    client_max_body_size 256k;
    proxy_pass http://127.0.0.1:5810/v1/sms/analyze;
    proxy_set_header Host $host;
    proxy_set_header Authorization $http_authorization;
    proxy_connect_timeout 5s;
    proxy_read_timeout 35s;
    proxy_send_timeout 10s;
    proxy_buffering off;
    add_header Cache-Control "no-store" always;
}

# Exact bounded household endpoints; never expose the gateway as a general proxy.
