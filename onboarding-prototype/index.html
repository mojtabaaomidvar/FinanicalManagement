<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>خانه‌یار — آنبوردینگ</title>
  <meta name="description" content="خانه‌یار؛ دستیار هوشمند خانه و خانواده" />
  <script>
    // تمِ ذخیره‌شده قبل از رنگ‌آمیزیِ اولین فریم اعمال می‌شود تا تم سوسو نزند
    document.documentElement.dataset.theme = localStorage.getItem("khanehyar-theme") || "dark";
  </script>
  <style>
    /* ═══ فونت ═══ */
    @font-face { font-family: "Vazirmatn"; src: url("fonts/Vazirmatn-Regular.woff2") format("woff2"); font-weight: 400; font-display: swap; }
    @font-face { font-family: "Vazirmatn"; src: url("fonts/Vazirmatn-Medium.woff2") format("woff2"); font-weight: 500; font-display: swap; }
    @font-face { font-family: "Vazirmatn"; src: url("fonts/Vazirmatn-SemiBold.woff2") format("woff2"); font-weight: 600; font-display: swap; }
    @font-face { font-family: "Vazirmatn"; src: url("fonts/Vazirmatn-Bold.woff2") format("woff2"); font-weight: 700; font-display: swap; }
    @font-face { font-family: "Vazirmatn"; src: url("fonts/Vazirmatn-ExtraBold.woff2") format("woff2"); font-weight: 800; font-display: swap; }

    /* ═══ توکن‌های طراحی — تم تاریک navy با رنگ‌های برند خانه‌یار ═══ */
    :root {
      --navy-900: #07111d;
      --navy-850: #0a1623;
      --navy-800: #0d1b2a;   /* برند: Navy */
      --navy-750: #102437;
      --navy-700: #132639;
      --navy-600: #1a3148;

      --emerald: #10b981;    /* برند: Emerald */
      --mint: #34d399;       /* برند: Mint */

      /* رنگ‌های ثابت بین دو تم */
      --accent: var(--emerald);
      --accent-2: var(--mint);
      --accent-glow: rgba(16, 185, 129, 0.34);

      /* رنگِ دامنه‌ها (ملایم، روی navy می‌نشینن) */
      --c-home: #34d399;  --c-family: #818cf8;  --c-child: #fbbf24;  --c-pet: #fb7185;
      --c-car: #38bdf8;   --c-gear: #a78bfa;    --c-money: #2dd4bf;  --c-cart: #34d399;
      --c-bill: #fbbf24;  --c-cal: #fb7185;     --c-fun: #a78bfa;    --c-gift: #38bdf8;
      --c-doc: #818cf8;

      /* متغیرهای سوئیچ‌شونده — پیش‌فرض تاریک */
      --bg: var(--navy-900);
      --bg-grad-a: var(--navy-900);
      --bg-grad-b: var(--navy-800);
      --surface: var(--navy-700);
      --surface-2: var(--navy-600);
      --surface-soft: rgba(52, 211, 153, 0.07);
      --border: rgba(148, 180, 210, 0.13);
      --border-strong: rgba(148, 180, 210, 0.26);
      --border-accent: rgba(52, 211, 153, 0.45);
      --text: #f1f6fb;
      --text-2: #b9c6d8;
      --text-3: #7d8ea6;
      --accent-soft: rgba(16, 185, 129, 0.14);
      --frame-bg: #050b12;
      --frame-ring: #0b1622;
      --frame-ring-soft: rgba(148, 180, 210, 0.08);
      --shadow-page: 0 40px 100px rgba(0, 0, 0, 0.6);

      --r-sm: 10px; --r-md: 14px; --r-lg: 20px; --r-pill: 999px;
      --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px; --sp-5: 20px; --sp-6: 28px;
      --dur-fast: 140ms; --dur-med: 260ms; --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
      --shadow-btn: 0 8px 24px rgba(16, 185, 129, 0.32);
      --maxw: 430px;
    }

    /* ═══ تم روشن ═══ */
    html[data-theme="light"] {
      --bg: #eef2ef;
      --bg-grad-a: #f6f9f7;
      --bg-grad-b: #e9f0ec;
      --surface: #ffffff;
      --surface-2: #f0f4f1;
      --surface-soft: rgba(16, 185, 129, 0.06);
      --border: rgba(13, 27, 42, 0.10);
      --border-strong: rgba(13, 27, 42, 0.20);
      --border-accent: rgba(16, 185, 129, 0.50);
      --text: #0d1b2a;
      --text-2: #3b4a5c;
      --text-3: #6b7a8b;
      --accent-soft: rgba(16, 185, 129, 0.10);
      /* متنِ تاکیدی روی سفید باید تیره‌تر باشد تا کنتراست بدهد */
      --accent-2: #047857;
      --frame-bg: #d9e2dc;
      --frame-ring: #ffffff;
      --frame-ring-soft: rgba(13, 27, 42, 0.06);
      --shadow-page: 0 40px 100px rgba(13, 27, 42, 0.18);
      --shadow-btn: 0 8px 24px rgba(16, 185, 129, 0.28);
    }
    /* روی پس‌زمینه‌ی روشن، آیکون‌های محو باید پررنگ‌تر باشند تا دیده شوند */
    html[data-theme="light"] .bg-it { opacity: 0.16; }
    html[data-theme="light"] .bg-halo { background: radial-gradient(circle, rgba(16,185,129,0.12) 0%, rgba(16,185,129,0) 66%); }
    /* حالتِ انتخاب‌شده روی سفید نیاز به لطافت بیشتری دارد */
    html[data-theme="light"] .opt.sel,
    html[data-theme="light"] .check.sel { background: linear-gradient(100deg, rgba(16,185,129,0.14), rgba(16,185,129,0.04)); }
    html[data-theme="light"] .chip.sel { background: linear-gradient(160deg, rgba(16,185,129,0.14), rgba(16,185,129,0.03)); }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; }

    body {
      font-family: "Vazirmatn", system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif;
      background: var(--frame-bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100dvh;
      transition: background var(--dur-med) var(--ease-out);
    }

    /* قاب گوشی روی دسکتاپ؛ روی موبایل تمام‌صفحه */
    .device {
      position: relative;
      width: 100%;
      max-width: var(--maxw);
      height: 100dvh;
      max-height: 932px;
      background: radial-gradient(140% 90% at 50% 0%, var(--bg-grad-b) 0%, var(--bg-grad-a) 62%);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: background var(--dur-med) var(--ease-out);
    }
    @media (min-width: 480px) and (min-height: 720px) {
      .device {
        height: min(900px, 94dvh);
        border-radius: 44px;
        border: 1px solid var(--border);
        box-shadow: var(--shadow-page), 0 0 0 10px var(--frame-ring), 0 0 0 11px var(--frame-ring-soft);
      }
    }

    /* ═══ پس‌زمینه‌ی گام خوش‌آمد — آیکون‌های شناور دامنه‌ها ═══ */
    .bg-icons { position: absolute; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
    .bg-it {
      position: absolute; left: var(--x); top: var(--y); width: var(--sz); height: var(--sz);
      color: var(--c, var(--accent)); opacity: 0.085;
      animation: drift var(--dur, 24s) ease-in-out var(--delay, 0s) infinite alternate;
    }
    .bg-it svg { display: block; width: 100%; height: 100%; }
    @keyframes drift {
      from { transform: translate3d(-50%, -50%, 0) rotate(calc(var(--tilt) * -1deg)); }
      to   { transform: translate3d(calc(-50% + var(--dx)), calc(-50% + var(--dy)), 0) rotate(var(--tilt)); }
    }
    /* هاله‌ی ملایم مرکزی */
    .bg-halo {
      position: absolute; z-index: 0; pointer-events: none;
      left: 50%; top: 38%; width: 340px; height: 340px; transform: translate(-50%, -50%);
      background: radial-gradient(circle, rgba(16,185,129,0.16) 0%, rgba(16,185,129,0) 66%);
      animation: haloPulse 6s ease-in-out infinite alternate;
    }
    @keyframes haloPulse { from { opacity: .55; } to { opacity: 1; } }

    /* ═══ صفحه‌بندی ═══ */
    .page {
      position: relative; z-index: 1;
      flex: 1 1 auto; min-height: 0;
      display: flex; flex-direction: column;
      padding: calc(env(safe-area-inset-top) + var(--sp-4)) var(--sp-5) calc(env(safe-area-inset-bottom) + var(--sp-5));
    }

    /* بالا: نقطه‌های پیشرفت + رد کردن + برگشت */
    .topbar {
      position: relative; display: flex; align-items: center; justify-content: center;
      min-height: 36px; margin-bottom: var(--sp-3); flex-shrink: 0;
    }
    .dots { display: flex; gap: 6px; }
    .dot {
      width: 7px; height: 7px; border-radius: var(--r-pill);
      background: var(--border-strong);
      transition: width var(--dur-med) var(--ease-out), background var(--dur-med) var(--ease-out), opacity var(--dur-med) var(--ease-out);
    }
    .dot.done { background: var(--accent); opacity: .45; }
    .dot.active { width: 24px; background: var(--accent); }
    .skip {
      position: absolute; inset-inline-start: 0; top: 50%; transform: translateY(-50%);
      background: none; border: 0; font: inherit; font-size: 13px; font-weight: 600;
      color: var(--text-3); cursor: pointer; padding: 6px 4px; transition: color var(--dur-fast);
    }
    .skip:hover { color: var(--text-2); }
    .top-actions {
      position: absolute; inset-inline-end: 0; top: 50%; transform: translateY(-50%);
      display: flex; align-items: center; gap: var(--sp-2);
    }
    .icon-btn {
      width: 34px; height: 34px; border-radius: var(--r-pill);
      background: var(--surface); border: 1px solid var(--border);
      color: var(--text-2); display: grid; place-items: center; cursor: pointer;
      transition: border-color var(--dur-fast), color var(--dur-fast), transform var(--dur-fast);
    }
    .icon-btn:hover { border-color: var(--border-accent); color: var(--accent-2); }
    .icon-btn:active { transform: scale(0.92); }
    /* display:grid صفتِ hidden را بی‌اثثر می‌کند — باید صریحًا دوباره پنهان کنیم */
    .icon-btn[hidden], .topbar[hidden] { display: none; }

    /* بدنه‌ی هر گام */
    .screen {
      flex: 1 1 auto; min-height: 0; overflow-y: auto;
      display: flex; flex-direction: column;
      /* safe center: وقتی جا هست وسط‌چین، وقتی سرریز می‌کنه از بالا می‌چسبه
         (جلوگیری از باگ کلاسیک center + overflow) */
      justify-content: safe center;
      gap: var(--sp-4);
      padding-block: var(--sp-3);
      animation: screenIn var(--dur-med) var(--ease-out);
      scrollbar-width: none;
    }
    .screen::-webkit-scrollbar { display: none; }
    @keyframes screenIn { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }

    .eyebrow {
      align-self: center; font-size: 12px; font-weight: 700; letter-spacing: .2px;
      color: var(--accent-2); background: var(--accent-soft);
      padding: 5px 14px; border-radius: var(--r-pill);
      border: 1px solid rgba(52, 211, 153, 0.18);
    }
    .head { text-align: center; }
    .title { font-size: 22px; font-weight: 800; line-height: 1.5; }
    .sub { font-size: 13.5px; color: var(--text-3); line-height: 1.85; margin-top: var(--sp-2); }

    /* ═══ کارت‌های گزینه (تک‌انتخابی) ═══ */
    .opt-list { display: flex; flex-direction: column; gap: var(--sp-3); }
    .opt {
      display: flex; align-items: center; gap: var(--sp-3);
      width: 100%; text-align: start; cursor: pointer;
      padding: var(--sp-4); border-radius: var(--r-lg);
      background: var(--surface); border: 1px solid var(--border);
      color: var(--text); font: inherit;
      transition: border-color var(--dur-fast) ease, background var(--dur-fast) ease, transform var(--dur-fast) ease;
    }
    .opt:hover { border-color: var(--border-strong); }
    .opt:active { transform: scale(0.985); }
    .opt.sel { border-color: var(--border-accent); background: linear-gradient(100deg, rgba(16,185,129,0.16), rgba(16,185,129,0.05)); }
    .opt-ic {
      flex-shrink: 0; width: 44px; height: 44px; border-radius: var(--r-md);
      display: grid; place-items: center; color: var(--c, var(--accent));
      background: color-mix(in srgb, var(--c, var(--accent)) 14%, transparent);
    }
    .opt-txt { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
    .opt-txt b { font-size: 15px; font-weight: 700; }
    .opt-txt span { font-size: 12.5px; color: var(--text-3); line-height: 1.7; }
    .opt-check {
      flex-shrink: 0; width: 24px; height: 24px; border-radius: var(--r-pill);
      border: 1.5px solid var(--border-strong); display: grid; place-items: center;
      color: transparent; transition: all var(--dur-fast) ease;
    }
    .opt.sel .opt-check { background: var(--accent); border-color: var(--accent); color: #04120c; }

    /* ═══ استپر اندازه‌ی خانواده ═══ */
    .stepper {
      align-self: center; display: flex; align-items: center; gap: var(--sp-5);
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--r-lg); padding: var(--sp-3) var(--sp-5);
    }
    .step-btn {
      width: 44px; height: 44px; border-radius: var(--r-md); cursor: pointer;
      background: var(--surface-2); border: 1px solid var(--border); color: var(--text);
      display: grid; place-items: center; font-size: 20px; font-weight: 700;
      transition: all var(--dur-fast) ease;
    }
    .step-btn:hover { border-color: var(--border-accent); color: var(--accent-2); }
    .step-btn:active { transform: scale(0.92); }
    .step-val { font-size: 30px; font-weight: 800; min-width: 96px; text-align: center; }
    .step-val small { font-size: 14px; font-weight: 600; color: var(--text-3); margin-inline-start: 4px; }

    /* ═══ چیپ‌های چندانتخابی (اهداف) ═══ */
    .chip-grid { display: grid; grid-template-columns: 1fr 1fr; gap: var(--sp-3); }
    .chip {
      display: flex; flex-direction: column; align-items: flex-start; gap: var(--sp-2);
      padding: var(--sp-4) var(--sp-3); border-radius: var(--r-lg); cursor: pointer;
      background: var(--surface); border: 1px solid var(--border);
      font: inherit; text-align: start; position: relative;
      transition: border-color var(--dur-fast) ease, background var(--dur-fast) ease, transform var(--dur-fast) ease;
      min-height: 96px;
    }
    .chip:active { transform: scale(0.97); }
    .chip.sel { border-color: var(--border-accent); background: linear-gradient(160deg, rgba(16,185,129,0.15), rgba(16,185,129,0.03)); }
    .chip-ic {
      width: 38px; height: 38px; border-radius: var(--r-md); display: grid; place-items: center;
      color: var(--c, var(--accent)); background: color-mix(in srgb, var(--c, var(--accent)) 15%, transparent);
    }
    .chip b { font-size: 13.5px; font-weight: 700; line-height: 1.45; }
    .chip span { font-size: 11.5px; color: var(--text-3); line-height: 1.6; }
    .chip-mark {
      position: absolute; inset-inline-end: 10px; top: 10px;
      width: 20px; height: 20px; border-radius: var(--r-pill);
      background: var(--accent); color: #04120c; display: grid; place-items: center;
      opacity: 0; transform: scale(0.5); transition: all var(--dur-fast) var(--ease-out);
    }
    .chip.sel .chip-mark { opacity: 1; transform: scale(1); }

    /* ═══ فهرست بازرسی (کارها / قبض‌ها) ═══ */
    .check-list { display: flex; flex-direction: column; gap: var(--sp-2); }
    .check {
      display: flex; align-items: center; gap: var(--sp-3);
      width: 100%; cursor: pointer; text-align: start; font: inherit;
      padding: 13px var(--sp-4); border-radius: var(--r-md);
      background: var(--surface); border: 1px solid var(--border); color: var(--text-2);
      font-size: 14.5px; font-weight: 600;
      transition: all var(--dur-fast) ease;
    }
    .check:active { transform: scale(0.985); }
    .check.sel { border-color: var(--border-accent); background: linear-gradient(100deg, rgba(16,185,129,0.14), rgba(16,185,129,0.03)); color: var(--text); }
    .check-box {
      flex-shrink: 0; width: 24px; height: 24px; border-radius: 7px;
      border: 1.5px solid var(--border-strong); display: grid; place-items: center;
      color: transparent; transition: all var(--dur-fast) ease;
    }
    .check.sel .check-box { background: var(--accent); border-color: var(--accent); color: #04120c; }

    /* ═══ سگمنت (واحد پول — منطق موجود، بازنویسی نشد) ═══ */
    .segmented {
      display: flex; gap: var(--sp-2); background: var(--surface);
      border: 1px solid var(--border); border-radius: var(--r-md); padding: 4px;
    }
    .seg {
      flex: 1; padding: 12px; border-radius: var(--r-sm); border: 0; cursor: pointer;
      background: transparent; color: var(--text-3); font: inherit; font-weight: 700; font-size: 14.5px;
      transition: all var(--dur-fast) ease;
    }
    .seg.sel { background: var(--accent); color: #04120c; box-shadow: 0 4px 14px rgba(16,185,129,0.3); }

    /* ═══ ورودی‌ها ═══ */
    .field { display: flex; flex-direction: column; gap: var(--sp-2); }
    .label { font-size: 13.5px; font-weight: 700; color: var(--text-2); padding-inline: var(--sp-1); }
    .input {
      width: 100%; padding: 14px var(--sp-4); border-radius: var(--r-md);
      background: var(--surface); border: 1px solid var(--border);
      color: var(--text); font: inherit; font-size: 15px; text-align: start;
      transition: border-color var(--dur-fast) ease;
    }
    .input::placeholder { color: var(--text-3); }
    .input:focus { outline: none; border-color: var(--border-accent); }

    /* ═══ رضایت (چک‌باکس غیر پیش‌تیک‌خورده — بخش ۳.۹) ═══ */
    .consent { display: flex; align-items: flex-start; gap: var(--sp-3); cursor: pointer; padding: var(--sp-2) 0; }
    .consent-box {
      flex-shrink: 0; width: 24px; height: 24px; border-radius: 7px; margin-top: 2px;
      border: 1.5px solid var(--border-strong); display: grid; place-items: center;
      color: transparent; background: transparent; transition: all var(--dur-fast) ease;
    }
    .consent.on .consent-box { background: var(--accent); border-color: var(--accent); color: #04120c; }
    .consent-txt { font-size: 12.5px; color: var(--text-3); line-height: 1.8; }
    .consent-txt a, .link { color: var(--accent-2); text-decoration: none; border-bottom: 1px solid rgba(52,211,153,0.35); }

    /* ═══ اکشن‌های پایین ═══ */
    .actions { display: flex; gap: var(--sp-3); padding-top: var(--sp-4); flex-shrink: 0; }
    .btn {
      padding: 15px; border-radius: var(--r-md); border: 0; font: inherit;
      font-size: 15.5px; font-weight: 700; cursor: pointer;
      transition: transform var(--dur-fast) ease, filter var(--dur-fast) ease, opacity var(--dur-fast) ease;
    }
    .btn:active { transform: scale(0.98); }
    .btn-primary {
      flex: 1; color: #04120c;
      background: linear-gradient(135deg, var(--accent-2), var(--accent));
      box-shadow: var(--shadow-btn);
    }
    .btn-primary:disabled { opacity: .55; box-shadow: none; cursor: not-allowed; }
    .btn-ghost { background: var(--surface-2); color: var(--text-2); padding-inline: var(--sp-6); }
    .btn-login {
      width: 100%; margin-top: var(--sp-3); padding: 13px; flex-shrink: 0;
      background: none; border: 1px solid var(--border-strong); border-radius: var(--r-md);
      font: inherit; font-size: 14.5px; font-weight: 600; color: var(--text-2); cursor: pointer;
      transition: all var(--dur-fast) ease;
    }
    .btn-login:hover { border-color: var(--border-accent); color: var(--accent-2); }

    .count-badge { font-size: 12.5px; font-weight: 600; color: var(--accent-2); opacity: .9; }

    /* ═══ خوش‌آمد ═══ */
    .hero { display: flex; flex-direction: column; align-items: center; text-align: center; gap: var(--sp-3); }
    .logo {
      width: 88px; height: 88px; border-radius: 26px; display: grid; place-items: center;
      background: linear-gradient(145deg, var(--accent-2), var(--accent)); color: #04120c;
      box-shadow: 0 18px 44px rgba(16,185,129,0.38), 0 6px 14px rgba(0,0,0,0.3);
      animation: logoIn 700ms var(--ease-out) both, logoFloat 5s ease-in-out 700ms infinite alternate;
    }
    @keyframes logoIn { from { opacity: 0; transform: scale(0.6) translateY(18px); } to { opacity: 1; transform: scale(1) translateY(0); } }
    @keyframes logoFloat { from { transform: translateY(0); } to { transform: translateY(-8px); } }
    .brand-name { font-size: 30px; font-weight: 800; letter-spacing: -.5px; }
    .tagline { font-size: 14.5px; color: var(--text-2); line-height: 1.85; max-width: 30ch; }

    /* نوار چرخشی دامنه‌ها روی خوش‌آمد */
    .domain-cycle {
      display: flex; align-items: center; gap: var(--sp-2); min-height: 40px;
      margin-top: var(--sp-2);
    }
    .dc-chip {
      display: inline-flex; align-items: center; gap: 7px;
      padding: 8px 14px; border-radius: var(--r-pill);
      background: var(--surface); border: 1px solid var(--border);
      font-size: 12.5px; font-weight: 700; color: var(--text-2);
      animation: chipIn 420ms var(--ease-out) both;
    }
    .dc-chip svg { color: var(--c, var(--accent)); }
    @keyframes chipIn { from { opacity: 0; transform: translateY(10px) scale(0.92); } to { opacity: 1; transform: translateY(0) scale(1); } }

    /* ═══ پروفایل خانه ═══ */
    .profile-card {
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg);
      overflow: hidden; animation: screenIn var(--dur-med) var(--ease-out);
    }
    .profile-head {
      display: flex; align-items: center; gap: var(--sp-3); padding: var(--sp-5) var(--sp-4);
      background: linear-gradient(120deg, rgba(16,185,129,0.14), rgba(16,185,129,0.02));
      border-bottom: 1px solid var(--border);
    }
    .profile-badge {
      flex-shrink: 0; width: 52px; height: 52px; border-radius: var(--r-md);
      background: linear-gradient(145deg, var(--accent-2), var(--accent)); color: #04120c;
      display: grid; place-items: center;
    }
    .profile-id { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
    .profile-id small { font-size: 11.5px; color: var(--text-3); font-weight: 600; }
    .profile-id b { font-size: 18px; font-weight: 800; }
    .profile-body { padding: var(--sp-4); display: flex; flex-direction: column; gap: var(--sp-3); }
    .profile-desc { font-size: 13px; color: var(--text-2); line-height: 1.9; }
    .mini-label { font-size: 11.5px; font-weight: 700; color: var(--text-3); }
    .mini-chips { display: flex; flex-wrap: wrap; gap: 7px; }
    .mini-chip {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 6px 12px; border-radius: var(--r-pill);
      background: var(--surface-soft); border: 1px solid var(--border);
      font-size: 12px; font-weight: 600; color: var(--text-2);
    }
    .mini-chip svg { color: var(--c, var(--accent)); }

    /* ═══ شخصی‌سازی (پروگرس) ═══ */
    .personalizing { display: flex; flex-direction: column; align-items: center; gap: var(--sp-5); text-align: center; }
    .orbit {
      width: 120px; height: 120px; border-radius: 50%; position: relative;
      display: grid; place-items: center;
      background: radial-gradient(circle, rgba(16,185,129,0.18) 0%, rgba(16,185,129,0) 70%);
    }
    .orbit::before {
      content: ""; position: absolute; inset: 14px; border-radius: 50%;
      border: 2px dashed rgba(52, 211, 153, 0.3); animation: spin 2.6s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .orbit-core { color: var(--accent-2); animation: pulse 1.8s ease-in-out infinite alternate; }
    @keyframes pulse { from { transform: scale(0.92); opacity: .8; } to { transform: scale(1.06); opacity: 1; } }
    .progress-wrap { width: 100%; display: flex; flex-direction: column; gap: var(--sp-3); }
    .progress-track {
      height: 8px; border-radius: var(--r-pill); background: var(--surface-2);
      overflow: hidden; border: 1px solid var(--border);
    }
    .progress-fill {
      height: 100%; width: 0%; border-radius: var(--r-pill);
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      transition: width 400ms var(--ease-out);
    }
    .progress-row { display: flex; justify-content: space-between; font-size: 12.5px; color: var(--text-3); font-weight: 600; }
    .progress-row b { color: var(--accent-2); }
    .status-line { font-size: 13px; color: var(--text-2); min-height: 22px; transition: opacity var(--dur-fast); }

    /* ═══ پایان ═══ */
    .done-wrap { display: flex; flex-direction: column; align-items: center; gap: var(--sp-4); text-align: center; }
    .done-ring {
      width: 96px; height: 96px; border-radius: 50%; display: grid; place-items: center;
      background: linear-gradient(145deg, var(--accent-2), var(--accent)); color: #04120c;
      box-shadow: 0 0 0 8px rgba(16,185,129,0.12), 0 18px 44px rgba(16,185,129,0.34);
      animation: logoIn 600ms var(--ease-out) both;
    }

    /* ═══ reduced motion ═══ */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: 1ms !important; animation-iteration-count: 1 !important; transition-duration: 1ms !important; }
      .bg-it { transform: translate3d(-50%, -50%, 0); }
    }
  </style>

      size: 2,
      goals: [],
      tasks: [],
      utilities: [],
      shopFreq: null,
      currency: "تومان",
      reminders: null,
      name: "",
      phone: "",
      password: "",
      consent: false,
    };

    const $ = (sel) => document.querySelector(sel);
    const icon = (name, size = 22) => `<svg width="${size}" height="${size}" aria-hidden="true"><use href="#${name}"/></svg>`;

    /* ═════════════════ محاسبه‌ی گام‌ها ═════════════════ */

    /* گام‌های تنظیم سریع — فقط برای دامنه‌های انتخابی که تنظیم سریع دارند */
    function quickSteps() {
      const out = [];
      if (state.goals.some((g) => ["family", "child", "home"].includes(g))) out.push("q-tasks");
      if (state.goals.includes("bill")) out.push("q-bills");
      if (state.goals.includes("shop")) out.push("q-shop");
      if (state.goals.includes("money")) out.push("q-finance");
      return out;
    }

    function allSteps() {
      return ["welcome", "living", "size", "goals", ...quickSteps(), "reminders", "profile", "personalizing", "account", "done"];
    }

    const STEP_META = {
      welcome:      { eyebrow: null,         skipable: false },
      living:       { eyebrow: "وضعیت سکونت", skipable: true },
      size:         { eyebrow: "اندازه‌ی خانواده", skipable: true },
      goals:        { eyebrow: "اهداف شما",  skipable: true },
      "q-tasks":    { eyebrow: "تنظیم سریع · کارها", skipable: true },
      "q-bills":    { eyebrow: "تنظیم سریع · قبض‌ها", skipable: true },
      "q-shop":     { eyebrow: "تنظیم سریع · خرید", skipable: true },
      "q-finance":  { eyebrow: "تنظیم سریع · مالی", skipable: true },
      reminders:    { eyebrow: "یادآوری‌ها", skipable: true },
      profile:      { eyebrow: "پروفایل خانه", skipable: false },
      personalizing:{ eyebrow: null,         skipable: false },
      account:      { eyebrow: "ساخت حساب",  skipable: false },
      done:         { eyebrow: null,         skipable: false },
    };

    /* ═════════════════ رندر ═════════════════ */

    function renderDots() {
      const steps = allSteps();
      const idx = steps.indexOf(state.step);
      const visible = steps.filter((s) => s !== "welcome");
      const visIdx = visible.indexOf(state.step);
      $("#dots").innerHTML = visible
        .map((s, i) => `<span class="dot${i === visIdx ? " active" : i < visIdx ? " done" : ""}"></span>`)
        .join("");
      return { idx, steps };
    }

    function renderChrome() {
      const meta = STEP_META[state.step] || {};
      const isWelcome = state.step === "welcome";
      const isEnd = state.step === "done";
      const showChrome = !isWelcome && !isEnd;

      $("#topbar").hidden = !showChrome;
      $("#bgHalo").hidden = !isWelcome;
      $("#bgIcons").hidden = !isWelcome;
      $("#loginBtn").hidden = !isWelcome;
      $("#actions").hidden = isWelcome || isEnd || state.step === "personalizing";

      if (showChrome) renderDots();

      const canSkip = meta.skipable && !["profile", "personalizing", "account"].includes(state.step);
      $("#skipBtn").hidden = !canSkip;
      $("#backBtn").hidden = !showChrome;
      /* دکمه‌ی تم فقط روی گام‌های ورود داده/اسکیپ‌شدنی */
      $("#themeBtn").hidden = !THEMEABLE_STEPS.has(state.step);
      $("#backBtn2").hidden = true; // تک‌دکمه‌ای نگه داشتن پایین؛ برگشت فقط بالاست

      /* برچسب دکمه + شمارنده‌ی انتخاب */
      const labels = {
        welcome: "شروع کنید",
        reminders: "تکمیل راه‌اندازی",
        profile: "ساخت حساب",
        account: "ساخت حساب",
      };
      const base = labels[state.step] || "ادامه";
      const n = countOf();
      const showCount = (state.step === "goals" || state.step === "q-tasks" || state.step === "q-bills") && n > 0;
      $("#nextBtn").innerHTML = showCount
        ? `${base} <span class="count-badge">(${toFa(n)} انتخاب‌شده)</span>`
        : base;

      /* غیرفعال بودن دکمه */
      const needs =
        state.step === "account" ? state.consent :
        true;
      $("#nextBtn").disabled = !needs;
    }

    function countOf() {
      if (state.step === "goals") return state.goals.length;
      if (state.step === "q-tasks") return state.tasks.length;
      if (state.step === "q-bills") return state.utilities.length;
      return 0;
    }

    /* ─── خوش‌آمد ─── */
    function viewWelcome() {
      return `
        <div class="hero">
          <div class="logo">${icon("i-home", 44)}</div>
          <div>
            <div class="brand-name">خانه‌یار</div>
            <p class="tagline">دستیار هوشمند خانه و خانواده</p>
          </div>
          <div class="domain-cycle" id="dc"></div>
        </div>`;
    }

    /* ─── گام‌های گزینه‌ای عمومی ─── */
    function optCard(item, sel, colorVar) {
      const c = colorVar || item.color || "var(--accent)";
      return `
        <button class="opt${sel ? " sel" : ""}" data-id="${item.id}" style="--c:${c}">
          <span class="opt-ic">${icon(item.icon, 22)}</span>
          <span class="opt-txt"><b>${item.title || item.name}</b>${item.desc ? `<span>${item.desc}</span>` : ""}</span>
          <span class="opt-check">${icon("i-check", 15)}</span>
        </button>`;
    }

    function viewLiving() {
      return `
        <div class="head">
          <p class="sub">این کمک می‌کند پیشنهادهای نگهداری و تجهیزات را متناسب با نوع خانه‌ی شما تنظیم کنیم.</p>
        </div>
        <div class="opt-list" id="list">
          ${LIVING_OPTIONS.map((o) => optCard(o, state.living === o.id)).join("")}
        </div>`;
    }

    function viewSize() {
      return `
        <div class="head">
          <p class="sub">این <b>تعداد اعلامیِ اعضا</b> است؛ ثبت‌نام جداگانه‌ی هر فرد لازم نیست و بعداً هم می‌توانید حساب واقعی هرکس را اضافه کنید.</p>
        </div>
        <div class="stepper">
          <button class="step-btn" id="stepMinus" aria-label="کاهش">${icon("i-minus", 18)}</button>
          <div class="step-val">${toFa(state.size)}<small>نفر</small></div>
          <button class="step-btn" id="stepPlus" aria-label="افزایش">${icon("i-plus", 18)}</button>
        </div>`;
    }

    function viewGoals() {
      return `
        <div class="head">
          <p class="sub">هرچه انتخاب کنید، روی داشبوردتان اولویت پیدا می‌کند. می‌توانید چند مورد را با هم انتخاب کنید.</p>
        </div>
        <div class="chip-grid" id="list">
          ${DOMAINS.map((d) => `
            <button class="chip${state.goals.includes(d.id) ? " sel" : ""}" data-id="${d.id}" style="--c:${d.color}">
              <span class="chip-ic">${icon(d.icon, 20)}</span>
              <b>${d.goal}</b>
              <span>${d.name}</span>
              <span class="chip-mark">${icon("i-check", 13)}</span>
            </button>`).join("")}
        </div>`;
    }

    function viewTasks() {
      return `
        <div class="head">
          <p class="sub">این کارها به خانواده‌ی شما اضافه می‌شوند. هرگز هم می‌توانید موارد بیشتر را اضافه کنید.</p>
        </div>
        <div class="check-list" id="list">
          ${STARTER_TASKS.map((t, i) => `
            <button class="check${state.tasks.includes(t) ? " sel" : ""}" data-id="${esc(t)}">
              <span class="check-box">${icon("i-check", 15)}</span>
              ${t}
            </button>`).join("")}
        </div>`;
    }

    function viewBills() {
      return `
        <div class="head">
          <p class="sub">قبض‌های انتخابی را پیگیری می‌کنیم و موعدشان را یادآوری می‌کنیم. بعداً در تنظیمات قابل تغییر است.</p>
        </div>
        <div class="check-list" id="list">
          ${UTILITIES.map((u) => `
            <button class="check${state.utilities.includes(u.id) ? " sel" : ""}" data-id="${u.id}">
              <span class="check-box">${icon("i-check", 15)}</span>
              ${u.name}
            </button>`).join("")}
        </div>`;
    }

    function viewShop() {
      return `
        <div class="head">
          <p class="sub">این کمک می‌کند تا زمان مناسب برای تهیه‌ی دوباره‌ی اقلام رایج را پیشنهاد دهیم.</p>
        </div>
        <div class="opt-list" id="list">
          ${SHOP_FREQS.map((f) => optCard({ ...f, icon: "i-cart" }, state.shopFreq === f.id, "var(--c-cart)")).join("")}
        </div>`;
    }

    function viewFinance() {
      return `
        <div class="head">
          <p class="sub">واحد نمایش پول را انتخاب کنید. این تنظیم بعداً در تنظیمات قابل تغییر است و روی همه‌ی مبالغ اعمال می‌شود.</p>
        </div>
        <div class="field">
          <span class="label">واحد پول</span>
          <div class="segmented" id="seg">
            <button class="seg${state.currency === "تومان" ? " sel" : ""}" data-v="تومان">تومان</button>
            <button class="seg${state.currency === "ریال" ? " sel" : ""}" data-v="ریال">ریال</button>
          </div>
        </div>`;
    }

    function viewReminders() {
      const opts = [
        { id: "yes", icon: "i-bell", color: "var(--accent)", title: "بله، یادآوری کن", desc: "دریافت نوتیفیکیشن‌های مفید" },
        { id: "no", icon: "i-bell", color: "var(--c-gear)", title: "نه، خودم مدیریت می‌کنم", desc: "بدون یادآوری" },
      ];
      return `
        <div class="head">
          <p class="sub">قبل از موعد قبض‌ها، کارهای تعمیراتی و رویدادهای خانواده به شما یادآوری می‌دهیم. هر زمان می‌توانید این تنظیم را عوض کنید.</p>
        </div>
        <div class="opt-list" id="list">
          ${opts.map((o) => optCard(o, state.reminders === o.id, o.color)).join("")}
        </div>`;
    }

    function viewProfile() {
      const n = state.size;
      const name = PROFILE_NAMES[n] || PROFILE_NAMES[5];
      const desc = PROFILE_DESCS[n > 4 ? 5 : n] || PROFILE_DESCS[3];
      const goals = state.goals.map((id) => domainById(id)).filter(Boolean);
      const living = LIVING_OPTIONS.find((l) => l.id === state.living);
      return `
        <div class="head">
          <p class="sub">خلاصه‌ای از آنچه تنظیم کردید. همه‌چیز بعداً قابل تغییر است.</p>
        </div>
        <div class="profile-card">
          <div class="profile-head">
            <span class="profile-badge">${icon("i-home", 26)}</span>
            <span class="profile-id">
              <small>پروفایل خانوار شما</small>
              <b>${esc(name)}</b>
            </span>
          </div>
          <div class="profile-body">
            <p class="profile-desc">${desc}</p>
            <div>
              <p class="mini-label" style="margin-bottom:8px">اولویت‌های داشبورد</p>
              <div class="mini-chips">
                ${goals.length ? goals.map((g) => `<span class="mini-chip" style="--c:${g.color}">${icon(g.icon, 15)} ${g.name}</span>`).join("") : `<span class="mini-chip">بدون اولویت خاص</span>`}
              </div>
            </div>
            <div>
              <p class="mini-label" style="margin-bottom:8px">تنظیم‌ها</p>
              <div class="mini-chips">
                <span class="mini-chip">${icon("i-users", 15)} ${toFa(n)} نفر</span>
                ${living ? `<span class="mini-chip">${icon("i-home", 15)} ${living.title}</span>` : ""}
                <span class="mini-chip">${icon("i-wallet", 15)} واحد: ${state.currency}</span>
                ${state.reminders === "yes" ? `<span class="mini-chip">${icon("i-bell", 15)} یادآوری روشن</span>` : `<span class="mini-chip">${icon("i-bell", 15)} بدون یادآوری</span>`}
              </div>
            </div>
          </div>
        </div>`;
    }

    function viewPersonalizing() {
      return `
        <div class="personalizing">
          <div class="orbit"><span class="orbit-core">${icon("i-home", 44)}</span></div>
          <div class="head">
            <h2 class="title">در حال شخصی‌سازی…</h2>
            <p class="sub">داریم خانه‌ی شما را آماده می‌کنیم. این فقط چند لحظه طول می‌کشد.</p>
          </div>
          <div class="progress-wrap">
            <div class="progress-row"><span id="pStatus">شروع…</span><b id="pPct">۰٪</b></div>
            <div class="progress-track"><div class="progress-fill" id="pFill"></div></div>
          </div>
        </div>`;
    }

    function viewAccount() {
      return `
        <div class="head">
          <p class="sub">برای ذخیره‌ی ترجیحات و همگام‌سازی بین دستگاه‌ها ثبت‌نام کنید. هیچ داده‌ای پیش از ساخت حساب ذخیره نشده است.</p>
        </div>
        <div class="field">
          <label class="label" for="fName">نام شما</label>
          <input class="input" id="fName" placeholder="مثلاً محمد" autocomplete="off" value="${esc(state.name)}" />
        </div>
        <div class="field">
          <label class="label" for="fPhone">شماره موبایل</label>
          <input class="input" id="fPhone" type="tel" inputmode="numeric" placeholder="۰۹۱۲۳۴۵۶۷۸۹" autocomplete="off" value="${esc(state.phone)}" />
        </div>
        <div class="field">
          <label class="label" for="fPass">رمز عبور</label>
          <input class="input" id="fPass" type="password" placeholder="حداقل ۶ کاراکتر" autocomplete="off" value="${esc(state.password)}" />
        </div>
        <label class="consent${state.consent ? " on" : ""}" id="consentBox">
          <span class="consent-box">${icon("i-check", 15)}</span>
          <span class="consent-txt">
            با <a href="#" onclick="return false">قوانین استفاده</a> و
            <a href="#" onclick="return false">سیاست حریم خصوصی</a> خانه‌یار موافقم.
          </span>
        </label>`;
    }

    function viewDone() {
      return `
        <div class="done-wrap">
          <div class="done-ring">${icon("i-check", 48)}</div>
          <h2 class="title">خانه‌ی شما آماده است</h2>
          <p class="sub">خوش آمدید به خانه‌یار! از این به بعد می‌توانید همه‌چیز را از تنظیمات تکمیل کنید.</p>
        </div>`;
    }

    const VIEWS = {
      welcome: viewWelcome, living: viewLiving, size: viewSize, goals: viewGoals,
      "q-tasks": viewTasks, "q-bills": viewBills, "q-shop": viewShop, "q-finance": viewFinance,
      reminders: viewReminders, profile: viewProfile, personalizing: viewPersonalizing,
      account: viewAccount, done: viewDone,
    };

    function esc(s) { return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }

    /* ═════════════════ چرخه‌ی آیکون خوش‌آمد ═════════════════ */
    let dcTimer = null, dcIdx = 0;
    function startDomainCycle() {
      const el = $("#dc");
      if (!el) return;
      const show = () => {
        const d = DOMAINS[dcIdx % DOMAINS.length];
        el.innerHTML = `<span class="dc-chip" style="--c:${d.color}">${icon(d.icon, 16)} ${d.name}</span>`;
        dcIdx++;
      };
      show();
      dcTimer = setInterval(show, 1400);
    }
    function stopDomainCycle() { if (dcTimer) { clearInterval(dcTimer); dcTimer = null; } }

    /* ═════════════════ ناوبری ═════════════════ */

    function go(step) {
      state.step = step;
      stopDomainCycle();
      const screen = $("#screen");
      screen.innerHTML = (VIEWS[step] || viewWelcome)();
      screen.scrollTop = 0;
      renderChrome();
      if (step === "welcome") startDomainCycle();
      if (step === "personalizing") runPersonalizing();
      wireStep();
    }

    function next() {
      const steps = allSteps();
      const i = steps.indexOf(state.step);
      if (i < steps.length - 1) go(steps[i + 1]);
    }
    function prev() {
      const steps = allSteps();
      const i = steps.indexOf(state.step);
      if (i > 0) go(steps[i - 1]);
    }
    function skip() {
      /* اسکیپ = پرش به یادآوری‌ها (آخرین گام پیکربندی).
         اگر خودش روی یادآوری است، یعنی «بدون یادآوری» → گام بعد.
         مطابق بخش ۳.۴، اسکیپ خطا نیست. */
      const steps = allSteps();
      const i = steps.indexOf(state.step);
      const rest = steps.slice(i + 1);
      const target = rest.find((s) => s === "reminders");
      go(target || steps[Math.min(i + 1, steps.length - 1)]);
    }

    /* ═════════════════ رویدادهای هر گام ═════════════════ */
    function wireStep() {
      const step = state.step;

      const list = $("#list");
      if (list) {
        list.querySelectorAll("[data-id]").forEach((btn) => {
          btn.addEventListener("click", () => {
            const id = btn.dataset.id;
            if (step === "living") { state.living = id; }
            else if (step === "goals") { toggleArr(state.goals, id); }
            else if (step === "q-tasks") { toggleArr(state.tasks, id); }
            else if (step === "q-bills") { toggleArr(state.utilities, id); }
            else if (step === "q-shop") { state.shopFreq = id; }
            refreshSel();
          });
        });
      }

      if (step === "size") {
        const bump = (d) => { state.size = Math.min(15, Math.max(1, state.size + d)); go("size"); };
        $("#stepMinus").addEventListener("click", () => bump(-1));
        $("#stepPlus").addEventListener("click", () => bump(1));
      }

      const seg = $("#seg");
      if (seg) {
        seg.querySelectorAll("[data-v]").forEach((b) => {
          b.addEventListener("click", () => { state.currency = b.dataset.v; refreshSel(); });
        });
      }

      if (step === "account") {
        const box = $("#consentBox");
        box.addEventListener("click", (e) => {
          if (e.target.tagName === "A") return;
          state.consent = !state.consent;
          box.classList.toggle("on", state.consent);
          $("#nextBtn").disabled = !state.consent;
        });
        const bind = (id, key) => { const el = $(id); if (el) el.addEventListener("input", () => { state[key] = el.value; }); };
        bind("#fName", "name"); bind("#fPhone", "phone"); bind("#fPass", "password");
      }
    }

    function toggleArr(arr, id) {
      const i = arr.indexOf(id);
      if (i >= 0) arr.splice(i, 1); else arr.push(id);
    }

    function refreshSel() {
      const step = state.step;
      const mark = (sel) => sel ? " sel" : "";
      if (step === "living" || step === "q-shop" || step === "reminders") {
        $("#list").querySelectorAll("[data-id]").forEach((b) => {
          const id = b.dataset.id;
          const sel = step === "living" ? state.living === id : step === "q-shop" ? state.shopFreq === id : state.reminders === id;
          b.classList.toggle("sel", sel);
        });
      } else if (step === "goals" || step === "q-tasks" || step === "q-bills") {
        $("#list").querySelectorAll("[data-id]").forEach((b) => {
          const id = b.dataset.id;
          const arr = step === "goals" ? state.goals : step === "q-tasks" ? state.tasks : state.utilities;
          b.classList.toggle("sel", arr.includes(id));
        });
      } else if (step === "q-finance") {
        $("#seg").querySelectorAll("[data-v]").forEach((b) => b.classList.toggle("sel", b.dataset.v === state.currency));
      }
      renderChrome();
    }

    /* ═════════════════ انیمیشن شخصی‌سازی ═════════════════ */
    function runPersonalizing() {
      const fill = $("#pFill"), pct = $("#pPct"), status = $("#pStatus");
      let p = 0, si = 0;
      const tick = () => {
        p = Math.min(100, p + 7 + Math.random() * 9);
        if (si < PERSONALIZE_STEPS.length - 1 && p > ((si + 1) / PERSONALIZE_STEPS.length) * 100) si++;
        fill.style.width = p + "%";
        pct.textContent = toFa(Math.round(p)) + "٪";
        status.textContent = PERSONALIZE_STEPS[si];
        if (p < 100) setTimeout(tick, 180);
        else setTimeout(() => next(), 480);
      };
      tick();
    }

    /* ═════════════════ راه‌اندازی ═════════════════ */

    /* دکمه‌های ثابت */
    $("#nextBtn").addEventListener("click", () => { if (!$("#nextBtn").disabled) next(); });
    $("#backBtn").addEventListener("click", prev);
    $("#skipBtn").addEventListener("click", skip);
    $("#themeBtn").addEventListener("click", () => {
      applyTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark");
    });
    $("#loginBtn").addEventListener("click", () => {
      alert("ورود — کاربر قدیمی (در نسخه‌ی نهایی اینجا فرم ورود باز می‌شود)");
    });

    /* پس‌زمینه‌ی خوش‌آمد */
    (function bg() {
      const wrap = $("#bgIcons");
      const items = [];
      DOMAINS.forEach((d, i) => {
        const angle = (i / DOMAINS.length) * Math.PI * 2 + Math.random() * 0.5;
        const r = 26 + Math.random() * 14;
        const el = document.createElement("span");
        el.className = "bg-it";
        el.style.setProperty("--x", (50 + Math.cos(angle) * r) + "%");
        el.style.setProperty("--y", (44 + Math.sin(angle) * r * 0.92) + "%");
        el.style.setProperty("--sz", (26 + Math.round(Math.random() * 24)) + "px");
        el.style.setProperty("--c", d.color);
        el.style.setProperty("--tilt", (6 + Math.round(Math.random() * 12)) * (Math.random() < .5 ? -1 : 1));
        el.style.setProperty("--dx", (8 + Math.round(Math.random() * 14)) * (Math.random() < .5 ? -1 : 1) + "px");
        el.style.setProperty("--dy", (8 + Math.round(Math.random() * 14)) * (Math.random() < .5 ? -1 : 1) + "px");
        el.style.setProperty("--dur", (20 + Math.round(Math.random() * 12)) + "s");
        el.style.setProperty("--delay", (-Math.round(Math.random() * 20)) + "s");
        el.innerHTML = icon(d.icon);
        wrap.appendChild(el);
      });
    })();

    go("welcome");

    /* همگام‌سازی آیکون دکمه‌ی تم با تمِ جاری (که پیش از این از localStorage اعمال شده) */
    applyTheme(document.documentElement.dataset.theme || "dark");
  </script>
</body>
</html>
